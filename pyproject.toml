[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldrua"
version = "0.1.0"
description = "WorldRUA: persistent programmable scenes for PyRUA robotic coding agents"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "numpy>=1.26,<2", "scipy>=1.10", "trimesh>=4.5", "Pillow>=10",
  "mcp>=1.8,<2", "uvicorn", "httpx", "msgpack-numpy", "websockets>=13",
  "PyYAML>=6", "imageio-ffmpeg>=0.5", "opencv-python-headless>=4.8,<4.12", "h5py>=3.10",
]

[project.optional-dependencies]
collision = ["python-fcl>=0.7", "rtree>=1.3"]
dev = ["pytest>=8", "build>=1.2", "ruff>=0.8"]

[project.scripts]
worldrua = "worldrua.cli:main"
worldrua-codex = "worldrua.codex_bridge:main"
pyrualean = "pyrualean.cli:main"
privilege = "privilege.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
worldrua = ["resources/*"]
pyrualean = ["knowledge/*.md", "*.json", "resources/**/*"]
privilege = ["resources/*", "resources/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/*.pyc", "**/__pycache__/*"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
